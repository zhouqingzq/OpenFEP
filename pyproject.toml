[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentum"
version = "0.1.0a1"
description = "Segmentum alpha: persistent cognitive agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["httpx>=0.27,<1", "requests>=2.31,<3"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1"]
# M5.4 semantic_similarity: multilingual sentence embeddings via sentence-transformers
validation = [
    "sentence-transformers>=3.0.0,<5",
    "scipy>=1.11,<2",
]
runtime = [
    "streamlit>=1.28,<2",
]

[tool.setuptools.packages.find]
include = ["segmentum*"]

[tool.pytest.ini_options]
addopts = "-m 'not stress and not m411 and not pre_m11 and not inactive_path_a'"
markers = [
    "stress: long-running soak, benchmark, and endurance tests excluded from default pytest runs",
    "m411: slow M411 phenomenology rollouts; run explicitly with pytest -m m411 tests/test_m411_phenomenology.py",
    "pre_m11: pre-M11.0 legacy tests skipped by default; run explicitly with pytest -m pre_m11",
    "inactive_path_a: frozen Path A / M10-and-earlier tests skipped by default; run explicitly with pytest -m inactive_path_a",
]
